# ==============================================
# Calley Automation - Environment Configuration
# ==============================================

# Browser: chrome | firefox | edge
browser=chrome
headless=false

# Application URLs
registration.url=https://app.getcalley.com/registration.aspx
login.url=https://app.getcalley.com/Login.aspx
base.url=https://app.getcalley.com

# Timeouts (in seconds)
implicit.wait=10
explicit.wait=30
page.load.timeout=60

# Test data file paths
user.data.file=src/test/resources/testdata/UserData.csv
agent.data.file=src/test/resources/testdata/AgentData.csv
call.list.csv=src/test/resources/testdata/Sample_File_in_.csv

# Plan to select during registration
plan.name=Calley Teams

# Screenshot directory
screenshot.dir=test-output/screenshots

# Report directory
report.dir=test-output/ExtentReports
